<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#0f0f0f">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px">
      <tr>
        <td style="padding:32px">
          <h2 style="margin:0 0 16px">Reset your password</h2>
          <p>Hi {{name}},</p>
          <p>We received a request to reset your password. Use the button below to choose a new one.</p>
          <p style="margin:24px 0">
            <a href="{{link}}" style="display:inline-block;background:#cc0000;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:24px;font-weight:bold">Reset password</a>
          </p>
          <p style="font-size:13px;color:#606060">This link expires in 1 hour. If you did not request a reset, you can safely ignore this email; your password will not change.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
